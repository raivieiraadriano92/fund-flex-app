<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div
      className="min-h-screen bg-gradient-to-b from-gray-50 to-gray-100 flex items-center justify-center p-6"
    >
      <div className="max-w-3xl w-full text-center space-y-12">
        {/* Logo and Name */}
        <div className="flex items-center justify-center space-x-3">
          <Wallet className="w-12 h-12 text-blue-600" />
          <h1 className="text-4xl font-bold text-gray-900">FundFlex</h1>
        </div>

        {/* Title and Description */}
        <div className="space-y-6">
          <h2 className="text-3xl font-semibold text-gray-800">
            Simplify Your Financial Journey
          </h2>
          <p className="text-xl text-gray-600 max-w-2xl mx-auto">
            Experience seamless money management with FundFlex. Track expenses,
            set budgets, and achieve your financial goals all in one place.
          </p>
        </div>

        {/* Download Section */}
        <div className="bg-white p-8 rounded-2xl shadow-lg inline-block">
          <div className="space-y-4">
            <QrCode className="w-48 h-48 mx-auto text-blue-600" />
            <p className="text-gray-700 font-medium">
              Scan to download FundFlex
            </p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
