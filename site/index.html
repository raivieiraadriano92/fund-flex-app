<!doctype html>
<html class="bg-[#EBECF0]">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Primary Meta Tags -->
    <title>FundFlex: Finance Mande Simple</title>
    <meta name="title" content="FundFlex: Finance Mande Simple" />
    <meta
      name="description"
      content="Take control of your finances with ease. Track expenses, set goals, and visualize your spending patterns. Smart analytics help you make better financial decisions."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FundFlex: Finance Mande Simple" />
    <meta
      property="og:description"
      content="Take control of your finances with ease. Track expenses, set goals, and visualize your spending patterns. Smart analytics help you make better financial decisions."
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="FundFlex: Finance Mande Simple" />
    <meta
      property="twitter:description"
      content="Take control of your finances with ease. Track expenses, set goals, and visualize your spending patterns. Smart analytics help you make better financial decisions."
    />
  </head>
  <body>
    <div class="flex min-h-screen flex-col">
      <main class="flex flex-grow items-center justify-center p-6">
        <div class="w-full max-w-xl space-y-12 text-center">
          <!-- {/* Logo and Name */} -->
          <div class="flex flex-col items-center justify-center space-y-3">
            <img src="./icon.png" class="h-48 w-48" />
            <h1 class="text-4xl font-bold text-gray-900">FundFlex</h1>
          </div>

          <!-- {/* Title and Description */} -->
          <div class="space-y-6">
            <h2 class="text-3xl font-semibold text-gray-800">
              Finance Mande Simple
            </h2>
            <p class="mx-auto max-w-2xl text-xl text-gray-600">
              Take control of your finances with ease. Track expenses, set
              goals, and visualize your spending patterns. Smart analytics help
              you make better financial decisions.
            </p>
          </div>

          <!-- {/* Download Section */} -->
          <div class="inline-block rounded-2xl bg-white p-8 shadow-lg">
            <div class="space-y-6">
              <img src="./qrcode.png" class="mx-auto h-48 w-48" />
              <p class="font-medium text-gray-700">Scan to download FundFlex</p>
              <div class="flex justify-center space-x-4">
                <a
                  href="https://apps.apple.com/us/app/fundflex-finance-mande-simple/id6740143675"
                  class="transition-opacity hover:opacity-80"
                  target="_blank"
                >
                  <img
                    src="./appstore.png"
                    alt="Download on the App Store"
                    class="h-10"
                  />
                </a>
                <a
                  href="https://play.google.com/store/apps/details?id=com.raivieiraadriano92.fundflexapp"
                  class="transition-opacity hover:opacity-80"
                  target="_blank"
                >
                  <img
                    src="./googleplay.png"
                    alt="Get it on Google Play"
                    class="h-10"
                  />
                </a>
              </div>
            </div>
          </div>
        </div>
      </main>

      <!-- {/* Footer */} -->
      <footer class="py-4 text-center text-gray-600">
        <div class="space-y-2">
          <div>
            Built with ❤️ by
            <a
              href="https://github.com/raivieiraadriano92"
              class="text-blue-600 transition-colors hover:text-blue-800"
              target="_blank"
              rel="noopener noreferrer"
              >Rai Vieira Adriano</a
            >
          </div>
          <div class="text-sm">
            <a
              href="./terms-conditions.html"
              class="mx-2 text-gray-500 transition-colors hover:text-gray-700"
              >Terms & Conditions</a
            >
            <span class="text-gray-400">•</span>
            <a
              href="./privacy-policy.html"
              class="mx-2 text-gray-500 transition-colors hover:text-gray-700"
              >Privacy Policy</a
            >
          </div>
        </div>
      </footer>
    </div>
  </body>
</html>
